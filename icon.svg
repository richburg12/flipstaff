<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- FLIPSTAFF — backlit shoji panel on dark lacquer, one ink staff, hanko seal -->
  <rect width="180" height="180" rx="34" fill="#17131d"/>
  <rect x="22" y="22" width="136" height="136" rx="8" fill="#241a13"/>
  <rect x="30" y="30" width="120" height="120" rx="4" fill="#ead9b4"/>
  <rect x="30" y="30" width="120" height="120" rx="4" fill="url(#g)"/>
  <defs>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#f2e6c9"/>
      <stop offset="1" stop-color="#dcc9a3" stop-opacity="0.9"/>
    </radialGradient>
  </defs>
  <!-- ground strokes: floor and ceiling both walkable -->
  <path d="M38 142 H142" stroke="#221c26" stroke-width="6" stroke-linecap="round"/>
  <path d="M38 38 H142" stroke="#221c26" stroke-width="6" stroke-linecap="round"/>
  <!-- the staff: one bold diagonal ink stroke, team-wrapped tips -->
  <path d="M52 128 L128 52" stroke="#2e2117" stroke-width="10" stroke-linecap="round"/>
  <path d="M52 128 L62 118" stroke="#c8391f" stroke-width="12" stroke-linecap="round"/>
  <path d="M128 52 L118 62" stroke="#20705f" stroke-width="12" stroke-linecap="round"/>
  <!-- somersaulting flip arc -->
  <path d="M60 64 C 78 40, 108 40, 122 62" stroke="#221c26" stroke-width="4.5"
        stroke-linecap="round" stroke-dasharray="1 11" fill="none"/>
  <!-- hanko seal -->
  <g transform="translate(124 124) rotate(-4)">
    <rect x="-13" y="-13" width="26" height="26" fill="#c8391f" opacity="0.85"/>
    <rect x="-7.5" y="-7.5" width="15" height="15" fill="none" stroke="#f2e6c9" stroke-width="2.4"/>
    <path d="M-7.5 0 H7.5" stroke="#f2e6c9" stroke-width="2.4"/>
  </g>
</svg>
